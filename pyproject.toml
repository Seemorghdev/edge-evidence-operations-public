[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-evidence-operations"
version = "0.6.0"
description = "Offline reviewed-command control, evidence governance, and sanitized readiness validation"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
edge-evidence-ops-portfolio-demo = "edge_evidence_operations.portfolio_demo:main"

[tool.setuptools.packages.find]
where = ["src"]
